<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050d1a"/>
      <stop offset="100%" style="stop-color:#0a1628"/>
    </linearGradient>
    <linearGradient id="glowBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#0066cc;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="chainGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#0066cc;stop-opacity:0.6"/>
    </linearGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a5c"/>
      <stop offset="100%" style="stop-color:#0d2137"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bg1)"/>

  <!-- Subtle grid lines -->
  <g stroke="#00d4ff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
    <line x1="640" y1="0" x2="640" y2="400"/>
  </g>

  <!-- Central glow blob -->
  <ellipse cx="400" cy="200" rx="220" ry="130" fill="url(#glowBlue)"/>

  <!-- Blockchain chain - horizontal blocks -->
  <!-- Block 1 -->
  <rect x="60" y="170" width="110" height="60" rx="8" fill="#0d2137" stroke="#00d4ff" stroke-width="1" stroke-opacity="0.7"/>
  <text x="115" y="196" font-family="monospace" font-size="9" fill="#00d4ff" fill-opacity="0.8" text-anchor="middle">BLOCK #1042</text>
  <text x="115" y="210" font-family="monospace" font-size="8" fill="#4a7fa0" text-anchor="middle">a3f8...c21d</text>
  <text x="115" y="222" font-family="monospace" font-size="8" fill="#4a7fa0" text-anchor="middle">verified ✓</text>

  <!-- Chain link 1→2 -->
  <line x1="170" y1="200" x2="210" y2="200" stroke="url(#chainGrad)" stroke-width="2.5" stroke-dasharray="4,2"/>
  <polygon points="208,196 215,200 208,204" fill="#00d4ff" fill-opacity="0.8"/>

  <!-- Block 2 -->
  <rect x="215" y="170" width="110" height="60" rx="8" fill="#0d2137" stroke="#00d4ff" stroke-width="1.5" stroke-opacity="0.9"/>
  <text x="270" y="196" font-family="monospace" font-size="9" fill="#00d4ff" text-anchor="middle">BLOCK #1043</text>
  <text x="270" y="210" font-family="monospace" font-size="8" fill="#4a7fa0" text-anchor="middle">7e2b...f90a</text>
  <text x="270" y="222" font-family="monospace" font-size="8" fill="#4a7fa0" text-anchor="middle">verified ✓</text>

  <!-- Chain link 2→3 -->
  <line x1="325" y1="200" x2="365" y2="200" stroke="url(#chainGrad)" stroke-width="2.5" stroke-dasharray="4,2"/>
  <polygon points="363,196 370,200 363,204" fill="#00d4ff" fill-opacity="0.8"/>

  <!-- Block 3 (active/highlighted) -->
  <rect x="370" y="162" width="118" height="76" rx="8" fill="#0d2a40" stroke="#00d4ff" stroke-width="2"/>
  <rect x="370" y="162" width="118" height="76" rx="8" fill="#00d4ff" fill-opacity="0.05"/>
  <text x="429" y="188" font-family="monospace" font-size="9" fill="#00d4ff" text-anchor="middle" filter="url(#glow)">BLOCK #1044</text>
  <text x="429" y="202" font-family="monospace" font-size="8" fill="#6ab0d0" text-anchor="middle">NEW RECORD</text>
  <text x="429" y="216" font-family="monospace" font-size="8" fill="#6ab0d0" text-anchor="middle">IPFS: Qm9x...3f</text>
  <text x="429" y="228" font-family="monospace" font-size="8" fill="#00ff88" text-anchor="middle">● MINTING...</text>

  <!-- Chain link 3→4 -->
  <line x1="488" y1="200" x2="528" y2="200" stroke="url(#chainGrad)" stroke-width="2.5" stroke-dasharray="4,2" stroke-opacity="0.4"/>
  <polygon points="526,196 533,200 526,204" fill="#00d4ff" fill-opacity="0.4"/>

  <!-- Block 4 (future, faded) -->
  <rect x="533" y="170" width="110" height="60" rx="8" fill="#080e18" stroke="#00d4ff" stroke-width="1" stroke-opacity="0.3"/>
  <text x="588" y="196" font-family="monospace" font-size="9" fill="#00d4ff" fill-opacity="0.3" text-anchor="middle">BLOCK #1045</text>
  <text x="588" y="210" font-family="monospace" font-size="8" fill="#2a4a60" text-anchor="middle">pending...</text>
  <text x="588" y="222" font-family="monospace" font-size="8" fill="#2a4a60" text-anchor="middle">— — —</text>

  <!-- Document icon (top left area) -->
  <g transform="translate(56, 62)">
    <rect width="50" height="62" rx="4" fill="url(#docGrad)" stroke="#00d4ff" stroke-width="1" stroke-opacity="0.6"/>
    <rect x="8" y="12" width="34" height="3" rx="1.5" fill="#00d4ff" fill-opacity="0.5"/>
    <rect x="8" y="20" width="26" height="3" rx="1.5" fill="#00d4ff" fill-opacity="0.3"/>
    <rect x="8" y="28" width="30" height="3" rx="1.5" fill="#00d4ff" fill-opacity="0.3"/>
    <rect x="8" y="36" width="22" height="3" rx="1.5" fill="#00d4ff" fill-opacity="0.3"/>
    <text x="25" y="54" font-family="monospace" font-size="8" fill="#00d4ff" text-anchor="middle">CERT</text>
    <!-- Verified badge -->
    <circle cx="42" cy="8" r="8" fill="#00ff88" fill-opacity="0.2" stroke="#00ff88" stroke-width="1"/>
    <text x="42" y="12" font-family="monospace" font-size="9" fill="#00ff88" text-anchor="middle">✓</text>
  </g>

  <!-- Arrow from doc to chain -->
  <line x1="118" y1="120" x2="118" y2="168" stroke="#00d4ff" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="4,3"/>
  <polygon points="114,166 118,174 122,166" fill="#00d4ff" fill-opacity="0.5"/>

  <!-- IPFS node (top right) -->
  <g transform="translate(648, 58)">
    <circle cx="40" cy="40" r="38" fill="#080f1e" stroke="#00d4ff" stroke-width="1" stroke-opacity="0.5"/>
    <text x="40" y="30" font-family="monospace" font-size="9" fill="#00d4ff" fill-opacity="0.8" text-anchor="middle">IPFS</text>
    <text x="40" y="44" font-family="monospace" font-size="8" fill="#4a7fa0" text-anchor="middle">distributed</text>
    <text x="40" y="56" font-family="monospace" font-size="8" fill="#4a7fa0" text-anchor="middle">storage</text>
    <!-- Node dots -->
    <circle cx="18" cy="40" r="3" fill="#00d4ff" fill-opacity="0.7"/>
    <circle cx="40" cy="20" r="3" fill="#00d4ff" fill-opacity="0.7"/>
    <circle cx="62" cy="40" r="3" fill="#00d4ff" fill-opacity="0.7"/>
    <circle cx="40" cy="60" r="3" fill="#00d4ff" fill-opacity="0.5"/>
    <line x1="21" y1="40" x2="37" y2="40" stroke="#00d4ff" stroke-width="0.8" stroke-opacity="0.4"/>
    <line x1="40" y1="23" x2="40" y2="37" stroke="#00d4ff" stroke-width="0.8" stroke-opacity="0.4"/>
    <line x1="59" y1="40" x2="43" y2="40" stroke="#00d4ff" stroke-width="0.8" stroke-opacity="0.4"/>
    <line x1="40" y1="57" x2="40" y2="43" stroke="#00d4ff" stroke-width="0.8" stroke-opacity="0.4"/>
  </g>

  <!-- Arrow from IPFS to block 3 -->
  <line x1="680" y1="98" x2="460" y2="162" stroke="#00d4ff" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="5,3"/>

  <!-- Ethereum logo (bottom right) -->
  <g transform="translate(680, 280)">
    <polygon points="40,0 55,28 40,36 25,28" fill="#00d4ff" fill-opacity="0.15" stroke="#00d4ff" stroke-width="1" stroke-opacity="0.6"/>
    <polygon points="40,36 55,28 40,56" fill="#00d4ff" fill-opacity="0.25" stroke="#00d4ff" stroke-width="1" stroke-opacity="0.6"/>
    <polygon points="40,36 25,28 40,56" fill="#00d4ff" fill-opacity="0.1" stroke="#00d4ff" stroke-width="1" stroke-opacity="0.4"/>
    <text x="40" y="75" font-family="monospace" font-size="9" fill="#4a7fa0" text-anchor="middle">ETHEREUM</text>
  </g>

  <!-- Bottom labels / status bar -->
  <rect x="0" y="360" width="800" height="40" fill="#050d1a" fill-opacity="0.8"/>
  <text x="30" y="386" font-family="monospace" font-size="11" fill="#00d4ff" fill-opacity="0.7">EDULOCKER</text>
  <text x="160" y="386" font-family="monospace" font-size="10" fill="#4a7fa0">● Blockchain • IPFS • Solidity • React</text>
  <circle cx="728" cy="380" r="5" fill="#00ff88" fill-opacity="0.8"/>
  <text x="740" y="385" font-family="monospace" font-size="10" fill="#00ff88">LIVE</text>

  <!-- Floating particles -->
  <circle cx="150" cy="300" r="2" fill="#00d4ff" fill-opacity="0.4"/>
  <circle cx="330" cy="320" r="1.5" fill="#00d4ff" fill-opacity="0.3"/>
  <circle cx="550" cy="280" r="2" fill="#00d4ff" fill-opacity="0.3"/>
  <circle cx="620" cy="310" r="1.5" fill="#00d4ff" fill-opacity="0.4"/>
  <circle cx="200" cy="90" r="1.5" fill="#00d4ff" fill-opacity="0.3"/>
  <circle cx="500" cy="70" r="2" fill="#00d4ff" fill-opacity="0.2"/>

  <!-- Title top -->
  <text x="400" y="46" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#ffffff" fill-opacity="0.9" text-anchor="middle">Decentralized Academic Document Verification</text>
</svg>
