    <rect x="12" y="190" width="110" height="22" rx="4" fill="#8247e5" fill-opacity="0.3" stroke="#8247e5" stroke-width="1"/>
    <text x="67" y="205" font-family="monospace" font-size="8" fill="#b280ff" text-anchor="middle">TRANSFER DEED</text>

    <rect x="134" y="190" width="112" height="22" rx="4" fill="#0d2a18" stroke="#00c85a" stroke-width="1"/>
    <text x="190" y="205" font-family="monospace" font-size="8" fill="#00c85a" text-anchor="middle">VIEW ON-CHAIN</text>
  </g>

  <!-- Polygon logo area -->
  <g transform="translate(620, 80)">
    <rect x="0" y="0" width="140" height="220" rx="6" fill="#0a0a18" stroke="#8247e5" stroke-width="1" stroke-opacity="0.4"/>
    <!-- Polygon diamond icon -->
    <g transform="translate(50, 30)">
      <polygon points="20,0 40,12 40,36 20,48 0,36 0,12" fill="#8247e5" fill-opacity="0.25" stroke="#8247e5" stroke-width="1.5"/>
      <polygon points="20,8 34,16 34,32 20,40 6,32 6,16" fill="#8247e5" fill-opacity="0.15"/>
      <text x="20" y="28" font-family="monospace" font-size="10" fill="#b280ff" text-anchor="middle">⬡</text>
    </g>
    <text x="70" y="100" font-family="monospace" font-size="11" fill="#8247e5" text-anchor="middle">POLYGON</text>
    <text x="70" y="114" font-family="monospace" font-size="8" fill="#6a4a8a" text-anchor="middle">BLOCKCHAIN</text>

    <!-- Stats -->
    <line x1="14" y1="128" x2="126" y2="128" stroke="#8247e5" stroke-width="0.5" stroke-opacity="0.4"/>
    <text x="70" y="148" font-family="monospace" font-size="8" fill="#6a6a8a" text-anchor="middle">Total Parcels</text>
    <text x="70" y="162" font-family="monospace" font-size="14" fill="#b280ff" text-anchor="middle">4,821</text>

    <text x="70" y="180" font-family="monospace" font-size="8" fill="#6a6a8a" text-anchor="middle">Fraud Cases</text>
    <text x="70" y="194" font-family="monospace" font-size="14" fill="#00c85a" text-anchor="middle">0</text>

    <text x="70" y="212" font-family="monospace" font-size="8" fill="#6a6a8a" text-anchor="middle">Gas: 0.0003 MATIC</text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="360" width="800" height="40" fill="#040a12" fill-opacity="0.9"/>
  <text x="30" y="386" font-family="monospace" font-size="11" fill="#8247e5">LAND REGISTRY WEB</text>
  <text x="210" y="386" font-family="monospace" font-size="10" fill="#4a4a6a">● Polygon • Solidity • Web3.js • React</text>
  <circle cx="730" cy="380" r="5" fill="#8247e5" fill-opacity="0.9"/>
  <text x="742" y="385" font-family="monospace" font-size="10" fill="#b280ff">ON-CHAIN</text>

  <!-- Title -->
  <text x="400" y="46" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#ffffff" fill-opacity="0.9" text-anchor="middle">Decentralized Land Ownership Registry on Polygon</text>

  <!-- Particles -->
  <circle cx="70" cy="330" r="2" fill="#8247e5" fill-opacity="0.4"/>
  <circle cx="300" cy="345" r="1.5" fill="#8247e5" fill-opacity="0.3"/>
  <circle cx="500" cy="335" r="2" fill="#8247e5" fill-opacity="0.3"/>
</svg>
