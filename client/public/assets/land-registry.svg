    <!-- Row 1 -->
    <rect x="12" y="12" width="70" height="55" rx="3" fill="#0d2a18" stroke="#00c85a" stroke-width="1.2"/>
    <text x="47" y="36" font-family="monospace" font-size="8" fill="#00c85a" text-anchor="middle">PARCEL</text>
    <text x="47" y="48" font-family="monospace" font-size="8" fill="#00c85a" text-anchor="middle">#A-001</text>
    <text x="47" y="60" font-family="monospace" font-size="7" fill="#2a6a40" text-anchor="middle">REGISTERED</text>

    <rect x="90" y="12" width="80" height="55" rx="3" fill="#1a1a0d" stroke="#e5c247" stroke-width="1.2"/>
    <text x="130" y="36" font-family="monospace" font-size="8" fill="#e5c247" text-anchor="middle">PARCEL</text>
    <text x="130" y="48" font-family="monospace" font-size="8" fill="#e5c247" text-anchor="middle">#A-002</text>
    <text x="130" y="60" font-family="monospace" font-size="7" fill="#8a7020" text-anchor="middle">DISPUTED</text>

    <rect x="178" y="12" width="70" height="55" rx="3" fill="#0d2a18" stroke="#00c85a" stroke-width="1.2"/>
    <text x="213" y="36" font-family="monospace" font-size="8" fill="#00c85a" text-anchor="middle">PARCEL</text>
    <text x="213" y="48" font-family="monospace" font-size="8" fill="#00c85a" text-anchor="middle">#A-003</text>
    <text x="213" y="60" font-family="monospace" font-size="7" fill="#2a6a40" text-anchor="middle">REGISTERED</text>

    <!-- Row 2 -->
    <rect x="12" y="75" width="50" height="70" rx="3" fill="#0d2a18" stroke="#00c85a" stroke-width="1.2"/>
    <text x="37" y="102" font-family="monospace" font-size="8" fill="#00c85a" text-anchor="middle">PARCEL</text>
    <text x="37" y="114" font-family="monospace" font-size="8" fill="#00c85a" text-anchor="middle">#B-001</text>

    <rect x="70" y="75" width="100" height="70" rx="3" fill="#1a0d0d" stroke="#e54747" stroke-width="1.5"/>
    <text x="120" y="102" font-family="monospace" font-size="8" fill="#e54747" text-anchor="middle">PARCEL</text>
    <text x="120" y="114" font-family="monospace" font-size="8" fill="#e54747" text-anchor="middle">#B-002</text>
    <text x="120" y="126" font-family="monospace" font-size="7" fill="#8a2020" text-anchor="middle">● ACTIVE TX</text>
    <text x="120" y="137" font-family="monospace" font-size="7" fill="#8a2020" text-anchor="middle">TRANSFERRING</text>

    <rect x="178" y="75" width="70" height="70" rx="3" fill="#0d2a18" stroke="#00c85a" stroke-width="1.2"/>
    <text x="213" y="102" font-family="monospace" font-size="8" fill="#00c85a" text-anchor="middle">PARCEL</text>
    <text x="213" y="114" font-family="monospace" font-size="8" fill="#00c85a" text-anchor="middle">#B-003</text>

    <!-- Row 3 -->
    <rect x="12" y="153" width="236" height="54" rx="3" fill="#0d2a18" stroke="#00c85a" stroke-width="1.2"/>
    <text x="130" y="174" font-family="monospace" font-size="8" fill="#00c85a" text-anchor="middle">PARCEL #C-001 (COMMERCIAL PLOT)</text>
    <text x="130" y="187" font-family="monospace" font-size="7" fill="#2a6a40" text-anchor="middle">Owner: 0x7a3F...9e2B • Area: 2400 sq.m</text>
    <text x="130" y="199" font-family="monospace" font-size="7" fill="#2a6a40" text-anchor="middle">Block: #20841 • Status: REGISTERED ✓</text>

