    <text x="180" y="74" font-family="monospace" font-size="8" fill="#00c85a" text-anchor="middle">VERIFIED ✓</text>

    <text x="140" y="100" font-family="monospace" font-size="9" fill="#6a6a8a">Chain</text>
    <rect x="140" y="106" width="80" height="18" rx="4" fill="#8247e5" fill-opacity="0.15" stroke="#8247e5" stroke-width="0.8"/>
    <text x="180" y="119" font-family="monospace" font-size="8" fill="#b280ff" text-anchor="middle">POLYGON</text>

    <text x="140" y="139" font-family="monospace" font-size="9" fill="#6a6a8a">Registered</text>
    <text x="140" y="152" font-family="monospace" font-size="9" fill="#c8c8e0">2024-03-15</text>

    <text x="140" y="172" font-family="monospace" font-size="9" fill="#6a6a8a">Prev Transfers</text>
    <text x="140" y="185" font-family="monospace" font-size="9" fill="#c8c8e0">3 records</text>

