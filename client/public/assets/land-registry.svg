    <text x="16" y="68" font-family="monospace" font-size="9" fill="#8247e5">0x7a3F2b9C...9e2B</text>

    <text x="16" y="88" font-family="monospace" font-size="9" fill="#6a6a8a">Token ID</text>
    <text x="16" y="101" font-family="monospace" font-size="9" fill="#b280ff">#LR-20841-C001</text>

    <text x="16" y="121" font-family="monospace" font-size="9" fill="#6a6a8a">Survey Number</text>
    <text x="16" y="134" font-family="monospace" font-size="9" fill="#c8c8e0">GJ-SUV-24-B002</text>

    <text x="16" y="154" font-family="monospace" font-size="9" fill="#6a6a8a">Area</text>
    <text x="16" y="167" font-family="monospace" font-size="9" fill="#c8c8e0">2400 sq. meters</text>

